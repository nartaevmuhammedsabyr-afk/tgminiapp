const _nt=V.net;V.net=()=>{const w=S.ws;return _nt()+'<h2>🏭 Цех мороженого</h2>'+(w.b?cr('🏭 Цех ур. '+w.lv+'/5','Запас: '+w.st+' порций · своё мороженое даёт +30% к чеку · налог цеха '+fs(5e4*(1+.5*w.lv))+' С/мес',bt('A.wu()',4e6*Math.pow(2.5,w.lv),w.lv>=5))+cr('🍨 Сварить партию','+'+wsY()+' порций · продукты стоят '+fs(wsC())+' С (дорого!)',bt('A.wm()',wsC())):cr('🏗️ Построить цех','Свои продукты, свои партии. Ингредиенты стоят дорого, налоги тоже','<button class="btn" onclick="A.wb()">'+fs(5e6)+' С</button>'))};
const _ct=V.city;V.city=()=>_ct()+'<h2 style="margin-top:20px">🌦️ Погода в городах</h2>'+CITIES.map((c,i)=>cr(c[1]+' '+c[2],wxi(i)+' · спрос ×'+wxm(i).toFixed(2),S.fr.includes(i)?'<b>🏷️</b>':'')).join('')+'<div class="sm">Жара и солнце повышают спрос, дождь и снег — снижают. В каждом городе своя погода.</div>';
const _ct2=V.city;V.city=()=>_ct2().replace(/(<div class="card"><div class="row"><div style="flex:1"><b>)(.*?)<\/b>/g,(m)=>m);
/* найм: меню из 5 человек */
const NM=['Айбек','Нурлан','Айгерим','Асель','Эрлан','Динара','Бекзат','Мээрим','Тимур','Алина','Руслан','Жанара','Данияр','Сезим','Максат','Кубат','Анара','Эмир','Салтанат','Чынгыз'],
TRT=[['Опытный','работает 5 лет, быстро обслуживает',.03,1.25],['Новичок','учится на ходу и просит меньше',0,.7],['Харизматичный','клиенты возвращаются снова и снова',.04,1.15],['Трудоголик','не берёт выходных, но стоит дорого',.05,1.4],['Дружелюбный','улыбка продаёт лучше рекламы',.02,.95],['Стажёр из колледжа','дёшево, но полон идей',.01,.8],['Бывший повар','знает вкусы, чек выше',.035,1.2],['Звезда соцсетей','приводит подписчиков',.045,1.35]];
Object.assign(A,{
hire(i,r){const p=S.pts[i];if(p.st[r]>=6){toast('Максимум 6 на должность');return}const key=S.day+'-'+i+'-'+r;
 if(!S.cand||S.cand.k!==key){const u=new Set(),L=[];while(L.length<5){const n=NM[R(NM.length)];if(u.has(n))continue;u.add(n);L.push({n,t:R(TRT.length)})}S.cand={k:key,L}}
 ov('<h2>'+ROLES[r][0]+' Выберите: '+ROLES[r][1]+'</h2>'+S.cand.L.map((c,k)=>{const t=TRT[c.t],w=Math.round(wage(p,r)*t[3]);return`<div class="card"><b style="font-size:21px">${c.n}</b><div class="sm" style="margin:4px 0 10px">${t[0]}: ${t[1]}. Бонус +${Math.round(t[2]*100)}% к прибыли точки.</div><button class="btn" style="width:100%" onclick="A.hire2(${i},${r},${k})">Нанять · ${fs(w)} С</button></div>`}).join('')+'<button class="btn" style="width:100%" onclick="this.closest(\'#ov\').remove()">Закрыть</button>',1)},
hire2(i,r,k){const p=S.pts[i],c=S.cand.L[k];if(!c||p.st[r]>=6)return;const t=TRT[c.t],w=Math.round(wage(p,r)*t[3]);if(S.m<w){toast('Не хватает денег: нужно '+fm(w));return}
 const o=$('#ov');if(o)o.remove();S.cand.L.splice(k,1);buy(w,()=>{p.st[r]++;p.xb=(p.xb||0)+t[2];log('🤝 Нанят '+c.n+' ('+ROLES[r][1]+')')})},
sk(){const p=P(),k=p.sk|0;if(k<5)buy(SKC[k+1],()=>{p.sk=k+1;log('🏪 Новый стиль: '+SKNAME[k+1])})},
rep(){const p=P();buy(1e5*p.l,()=>p.rep=Math.min(100,rp(p)+8))},
wb(){buy(5e6,()=>{S.ws.b=1;log('🏭 Цех построен!')})},wu(){buy(4e6*Math.pow(2.5,S.ws.lv),()=>S.ws.lv++)},
wm(){const c=wsC();if(S.m<c){toast('Не хватает денег на продукты: '+fm(c));return}S.m-=c;S.exp+=c;S.ws.st+=wsY();log('🍨 Партия готова: +'+wsY()+' порций');sv();render()},
tu(){buy(3e6*Math.pow(2.3,S.tl),()=>S.tl++)},
lt(a){a=Math.min(a,1e7-S.loan);if(a<=0){toast('Лимит кредита 10 млн исчерпан');return}S.m+=a;S.loan+=a;btx('Кредит взят',a);log('💳 Кредит +'+fm(a));sv();render()},
lp(a){a=a?Math.min(a,S.loan):S.loan;if(a<=0){toast('Долга нет');return}if(S.m<a){toast('Не хватает денег: нужно '+fm(a));return}S.m-=a;S.loan-=a;btx('Погашение кредита',-a);toast('✅ Погашено '+fm(a));sv();render()},
bk(k){const a=nn('#bka'),b=S.bk;if(a<=0){toast('Введите сумму');return}
 if(k==0){if(a>S.m)return toast('Не хватает денег');S.m-=a;b.b+=a;btx('Взнос на счёт',a)}
 else if(k==1){if(a>b.b)return toast('На счёте меньше');b.b-=a;S.m+=a;btx('Снятие',-a)}
 else if(k==2){if(a>b.b)return toast('На счёте меньше');b.b-=a;b.s+=a;btx('В накопительный',a)}
 else{if(a>b.s)return toast('Накоплений меньше');b.s-=a;b.b+=a;btx('Из накопительного',-a)}sv();render()},
bl(){const n=LVL[S.bk.lv+1];if(n)buy(n[1],()=>{S.bk.lv++;log('🏦 Уровень банка: '+n[0])})}});
const _fr=A.fire;A.fire=(i,r)=>{const p=S.pts[i];if(p.st[r]>0){const n=SN(p);p.xb=(p.xb||0)*(n-1)/n}_fr(i,r)};
/* бонус-шарики на сцене */
setInterval(()=>{if(tab!=='shop'||document.hidden||$('#ov')||S.cur!==0)return;const sc=$('#scene');if(!sc||sc.querySelector('.bon')||Math.random()<.4)return;const b=document.createElement('button');b.className='bon';b.textContent=['🎈','🎁','⭐'][R(3)];b.onclick=()=>{const v=Math.round(Math.max(5000,nC(P())*avgP()*tk(P())*(1+R(3))));S.m+=v;S.tot+=v;log('🎈 Бонус +'+fm(v));b.remove();sv()};sc.appendChild(b);setTimeout(()=>b.remove(),7000)},9000);

let booted=0;
function boot(){if(booted)return;booted=1;render();welcome();catchUp()}
function applyCloud(c){if(!c||run)return;if((!S.named&&c.named)||(c.named&&(c.ts||0)>(S.ts||0))){S=c;cLast='';cChunks=[];try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}document.querySelectorAll('#ov').forEach(e=>e.remove());if(booted){render();welcome();catchUp()}}}
if(CS){setTimeout(boot,1800);try{CS.getItem('d4n',(e,v)=>{const n=Math.min(parseInt(v)||0,50);if(e||!n)return boot();const ks=Array.from({length:n},(_,i)=>'d4_'+i);
  CS.getItems(ks,(e2,o)=>{try{if(!e2)applyCloud(norm(JSON.parse(ks.map(k=>o[k]||'').join(''))))}catch(x){}boot()})})}catch(e){boot()}}else boot();
</script></body></html>
